name: Checks

on:
    push:
        branches: [dev, main]
    pull_request:
        branches: [dev, main]
    workflow_dispatch:

# a new push to a branch or a pull request cancels its older run, whose result no longer counts
concurrency:
    group: checks-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    format:
        name: Format
        runs-on: ubuntu-24.04
        env:
            CLANG_FORMAT: clang-format-18
        steps:
            - uses: actions/checkout@v4

            # the C files must be as clang-format 18, Ubuntu 24.04's, writes them; agents format them with check.sh
            - name: Install clang-format
              run: sudo apt-get install -y clang-format-18

            - name: Check the C files' format
              run: .github/scripts/format.sh

    test-linux:
        name: Test (Linux)
        runs-on: ubuntu-24.04
        steps:
            # shuild and shu, which build the plugins in C, are submodules
            - uses: actions/checkout@v4
              with:
                  submodules: true

            # the template follows OpenECS's dev: its Debug build runs tests, which releases do not
            - uses: actions/checkout@v4
              with:
                  repository: omerfuyar/OpenECS
                  ref: dev
                  submodules: recursive
                  path: OpenECS

            - name: Install the build tools
              run: OpenECS/.github/scripts/install-linux.sh

            - name: Name the dependencies' versions
              id: dependencies
              working-directory: OpenECS
              run: echo "key=$( (git submodule status --recursive; sha256sum shuild.c dependencies/other/*/*) | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

            - name: Restore the built dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      OpenECS/.shu/Debug/dependencies
                  key: debug-linux-${{ steps.dependencies.outputs.key }}

            - name: Build OpenECS
              working-directory: OpenECS
              run: |
                  gcc shuild.c -o shuild.ignore -O3 -Wno-format-truncation
                  ./shuild.ignore -b debug > build.log 2>&1 || true
                  test -x build/Debug/bin/OpenECS || (tail -n 40 build.log && exit 1)

            # the program writes include/ as a release has it: the plugin interface and the standard plugins' definitions
            - name: Lay out OpenECS as a release
              run: |
                  cp -r OpenECS/build/Debug/bin/. OpenECS/
                  OpenECS/OpenECS --definitions OpenECS/include > definitions.log 2>&1 || (cat definitions.log && exit 1)

            - name: Build the plugins in C
              run: cc shuild.c -o shuild && ./shuild

            - name: Run the test
              run: |
                  OpenECS/OpenECS --test test.lua > test.log 2>&1 && ! grep -q -E 'Sanitizer|runtime error:' test.log || (cat test.log && exit 1)
                  grep "The test" test.log

    test-windows:
        name: Test (Windows)
        runs-on: windows-2025
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: true

            - uses: actions/checkout@v4
              with:
                  repository: omerfuyar/OpenECS
                  ref: dev
                  submodules: recursive
                  path: OpenECS

            # LLVM-MinGW with the UCRT runtime, which OpenECS is built with, and CMake and Ninja for SDL
            - name: Install the build tools
              shell: pwsh
              run: OpenECS/.github/scripts/install-windows.ps1

            - name: Name the dependencies' versions
              id: dependencies
              working-directory: OpenECS
              run: echo "key=$( (git submodule status --recursive; sha256sum shuild.c dependencies/other/*/*) | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

            - name: Restore the built dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      OpenECS/.shu/Debug/dependencies
                  key: debug-windows-${{ steps.dependencies.outputs.key }}

            - name: Build OpenECS
              working-directory: OpenECS
              run: |
                  clang shuild.c -o shuild.ignore.exe -O3 -Wno-format-truncation
                  ./shuild.ignore.exe -b debug -c clang > build.log 2>&1 || true
                  test -f build/Debug/bin/OpenECS.exe || (tail -n 40 build.log && exit 1)

            # as a release is laid out: the program writes include/, and lib/ has OpenECS's import library that a plugin's DLL links
            - name: Lay out OpenECS as a release
              run: |
                  cp -r OpenECS/build/Debug/bin/. OpenECS/
                  cp -r OpenECS/build/Debug/lib OpenECS/
                  OpenECS/OpenECS.exe --definitions OpenECS/include > definitions.log 2>&1 || (cat definitions.log && exit 1)

            - name: Build the plugins in C
              run: clang shuild.c -o shuild.exe && ./shuild.exe

            - name: Run the test
              run: |
                  OpenECS/OpenECS.exe --test test.lua > test.log 2>&1 || (cat test.log && exit 1)
                  grep "The test" test.log

    lua:
        name: Lua (LuaLS)
        runs-on: ubuntu-24.04
        env:
            LUALS_VERSION: 3.15.0
        steps:
            - uses: actions/checkout@v4

            - uses: actions/checkout@v4
              with:
                  repository: omerfuyar/OpenECS
                  ref: dev
                  path: OpenECS-source

            - name: Install the Lua language server
              run: |
                  mkdir -p "$RUNNER_TEMP/luals"
                  curl -sSL "https://github.com/LuaLS/lua-language-server/releases/download/$LUALS_VERSION/lua-language-server-$LUALS_VERSION-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP/luals"

            # ecs.lua describes the ecs module, so the check finds Lua code that misuses it
            - name: Check the Lua files
              run: |
                  mkdir -p OpenECS && mv OpenECS-source/include OpenECS/include && rm -rf OpenECS-source
                  "$RUNNER_TEMP/luals/bin/lua-language-server" --check="$GITHUB_WORKSPACE" --checklevel=Warning --logpath="$RUNNER_TEMP/luals-log" | tee luals.log
                  grep -q "no problems found" luals.log
